<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">GemBull app icon</title>
  <desc id="desc">Geometric bull with neon lime horns, a ritual pulse, white muzzle, and a black square background.</desc>
  <defs>
    <radialGradient id="background">
      <stop offset="0" stop-color="#050905" />
      <stop offset="1" stop-color="#010302" />
    </radialGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CEFF0A" />
      <stop offset="1" stop-color="#AFFF00" />
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#F5F5F3" />
    </linearGradient>
  </defs>

  <rect width="1254" height="1254" fill="url(#background)" />

  <!-- White facets sit behind the horns and the central ritual mark. -->
  <g fill="url(#white)">
    <path d="M397 430 483 407 433 527Z" />
    <path d="M857 430 771 407 821 527Z" />
    <path d="M484 359 618 319 568 421 532 422Z" />
    <path d="M770 359 636 319 686 421 722 422Z" />
    <path d="M270 653 422 768 439 945Z" />
    <path d="M984 653 832 768 815 945Z" />
  </g>

  <!-- Mirrored angular horns from the approved raster icon. -->
  <g fill="url(#lime)">
    <path d="M425 110 191 258Q187 261 184 267L109 418 215 539H421Q437 539 434 525L406 445Q403 435 392 431L261 367Z" />
    <path d="M829 110 1063 258Q1067 261 1070 267L1145 418 1039 539H833Q817 539 820 525L848 445Q851 435 862 431L993 367Z" />
  </g>

  <!-- White circular ritual mark, lime forehead gem, and pulse. -->
  <circle cx="627" cy="586" r="154" fill="url(#white)" />
  <circle cx="627" cy="586" r="114" fill="url(#background)" />
  <path d="M627 340 669 411 627 489 585 411Z" fill="url(#lime)" />
  <path d="M526 572H583L590 577 628 498 655 601 667 571H726V592H680L649 654 624 556 598 609 581 592H526Z" fill="url(#lime)" />

  <!-- Lower lime cheek facets. -->
  <g fill="url(#lime)">
    <path d="M341 586 481 684Q489 690 483 695Q479 700 467 697L389 682Z" />
    <path d="M913 586 773 684Q765 690 771 695Q775 700 787 697L865 682Z" />
  </g>

  <!-- The muzzle is one broad white facet with two dark nostrils. -->
  <path d="M534 804H720L789 883 739 978H515L465 883Z" fill="url(#white)" />
  <g fill="#010302">
    <path d="M506 872 585 895 604 935H547Z" />
    <path d="M748 872 669 895 650 935H707Z" />
  </g>
  <path d="M535 1000H719L627 1114Z" fill="url(#lime)" />
</svg>
