[package]
name = "gembull-core"
description = "GemBull NEP-141 token and daily ritual"
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.99.1"
# TODO: Fill out the repository field to help NEAR ecosystem tools to discover your project.
# NEP-0330 is automatically implemented for all contracts built with https://github.com/near/cargo-near.
# Link to the repository will be available via `contract_source_metadata` view-function.
# Set repository after the team chooses a public repository URL.

[lib]
crate-type = ["cdylib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"

[dev-dependencies]
base64 = "0.22"
near-sdk = { version = "5.30", features = ["unit-testing"] }
aws-lc-rs = { version = "1.19", features = ["prebuilt-nasm"] }
near-sandbox = "0.4.0"
near-api = "0.8"
tokio = { version = "1.12.0", features = ["full"] }
testresult = "0.4.1"

[profile.release]
codegen-units = 1
# Tell `rustc` to optimize for small code size.
opt-level = "z"
lto = true
debug = false
panic = "abort"
# Opt into extra safety checks on arithmetic operations https://stackoverflow.com/a/64136471/249801
overflow-checks = true

# `cfg(near)` was introduced in `near-sdk` v5.27.0, and is expected cfg now
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
