name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/ritl-core
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: rustup target add wasm32-unknown-unknown
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.23.0/cargo-near-installer.sh | sh
      - name: Format
        run: cargo fmt --check
      - name: Unit tests
        run: cargo test --lib
      - name: Build Wasm
        run: cargo near build non-reproducible-wasm --no-abi
      - name: Sandbox integration
        run: cargo test --test ritual_sandbox -- --nocapture

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm build

  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/simulate_60_days.py --check
